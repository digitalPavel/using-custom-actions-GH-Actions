name: Getting & Caching Dependencies # display name shown in GitHub Actions UI and marketplace
description: Get the dependencies (via npm) and cache them. # explains what this action does — shown in marketplace and when used as a dependency
runs:  #defines how the action executes — required in every action.yml
    using: composite # tells GitHub this is a composite action (runs multiple steps, not a Docker or JS action)
    steps: 
      - name: Cache dependencies
        id: cache
        uses: actions/cache@v6
        with:
          path: node_modules
          key: deps-node-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
        shell: bash # required in composite actions — regular workflows inherit shell, composite actions do not